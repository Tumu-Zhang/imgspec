name: 功能建议
description: 希望支持的新格式、新参数或界面改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在卡在哪？例如「期刊还要求 EPS，目前转不了」
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？有参考的工具或期刊要求也可以贴出来
