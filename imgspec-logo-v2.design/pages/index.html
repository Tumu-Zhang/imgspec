<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imgspec Logo B5 优化版</title>
    <style id="theme-vars">
:root {
  /* Brand primitives — extracted from the approved imgspec palette */
  --imgspec-brand: #2563EB;
  --imgspec-structural: #1E40AF;
  --imgspec-accent: #22D3EE;
  --imgspec-panel: #F3F0E8;
  --imgspec-white: #FFFFFF;
  --imgspec-ink: #1B2330;

  /* Semantic aliases required by the head contract */
  --imgspec-background: var(--imgspec-panel);
  --imgspec-foreground: var(--imgspec-structural);
  --imgspec-card: #FFFFFF;
  --imgspec-card-foreground: var(--imgspec-ink);
  --imgspec-popover: #FFFFFF;
  --imgspec-popover-foreground: var(--imgspec-ink);
  --imgspec-primary: var(--imgspec-brand);
  --imgspec-primary-foreground: var(--imgspec-white);
  --imgspec-muted: #E8E4DA;
  --imgspec-muted-foreground: #5A6572;
  --imgspec-border: #D6D2C8;
  --imgspec-input: #FFFFFF;
  --imgspec-ring: rgba(37, 99, 235, 0.35);

  /* Radius scale */
  --imgspec-radius-sm: 4px;
  --imgspec-radius-md: 8px;
  --imgspec-radius-lg: 16px;

  /* Typography */
  --imgspec-font-sans: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --imgspec-font-serif: Georgia, "Source Han Serif SC", "Noto Serif SC", serif;
  --imgspec-font-mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--imgspec-background);
    --color-foreground: var(--imgspec-foreground);
    --color-card: var(--imgspec-card);
    --color-card-foreground: var(--imgspec-card-foreground);
    --color-popover: var(--imgspec-popover);
    --color-popover-foreground: var(--imgspec-popover-foreground);
    --color-primary: var(--imgspec-primary);
    --color-primary-foreground: var(--imgspec-primary-foreground);
    --color-muted: var(--imgspec-muted);
    --color-muted-foreground: var(--imgspec-muted-foreground);
    --color-accent: var(--imgspec-accent);
    --color-border: var(--imgspec-border);
    --color-input: var(--imgspec-input);
    --color-ring: var(--imgspec-ring);
    --radius-sm: var(--imgspec-radius-sm);
    --radius-md: var(--imgspec-radius-md);
    --radius-lg: var(--imgspec-radius-lg);
  }
  @layer base {
    body { background: var(--imgspec-background); color: var(--imgspec-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--imgspec-background); }
      .text-background { color: var(--imgspec-background); }
      .border-background { border-color: var(--imgspec-background); }
      .ring-background { --tw-ring-color: var(--imgspec-background); }
      .bg-foreground { background-color: var(--imgspec-foreground); }
      .text-foreground { color: var(--imgspec-foreground); }
      .border-foreground { border-color: var(--imgspec-foreground); }
      .ring-foreground { --tw-ring-color: var(--imgspec-foreground); }
      .bg-card { background-color: var(--imgspec-card); }
      .text-card { color: var(--imgspec-card); }
      .border-card { border-color: var(--imgspec-card); }
      .ring-card { --tw-ring-color: var(--imgspec-card); }
      .bg-card-foreground { background-color: var(--imgspec-card-foreground); }
      .text-card-foreground { color: var(--imgspec-card-foreground); }
      .border-card-foreground { border-color: var(--imgspec-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--imgspec-card-foreground); }
      .bg-popover { background-color: var(--imgspec-popover); }
      .text-popover { color: var(--imgspec-popover); }
      .border-popover { border-color: var(--imgspec-popover); }
      .ring-popover { --tw-ring-color: var(--imgspec-popover); }
      .bg-popover-foreground { background-color: var(--imgspec-popover-foreground); }
      .text-popover-foreground { color: var(--imgspec-popover-foreground); }
      .border-popover-foreground { border-color: var(--imgspec-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--imgspec-popover-foreground); }
      .bg-primary { background-color: var(--imgspec-primary); }
      .text-primary { color: var(--imgspec-primary); }
      .border-primary { border-color: var(--imgspec-primary); }
      .ring-primary { --tw-ring-color: var(--imgspec-primary); }
      .bg-primary-foreground { background-color: var(--imgspec-primary-foreground); }
      .text-primary-foreground { color: var(--imgspec-primary-foreground); }
      .border-primary-foreground { border-color: var(--imgspec-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--imgspec-primary-foreground); }
      .bg-muted { background-color: var(--imgspec-muted); }
      .text-muted { color: var(--imgspec-muted); }
      .border-muted { border-color: var(--imgspec-muted); }
      .ring-muted { --tw-ring-color: var(--imgspec-muted); }
      .bg-muted-foreground { background-color: var(--imgspec-muted-foreground); }
      .text-muted-foreground { color: var(--imgspec-muted-foreground); }
      .border-muted-foreground { border-color: var(--imgspec-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--imgspec-muted-foreground); }
      .bg-accent { background-color: var(--imgspec-accent); }
      .text-accent { color: var(--imgspec-accent); }
      .border-accent { border-color: var(--imgspec-accent); }
      .ring-accent { --tw-ring-color: var(--imgspec-accent); }
      .bg-border { background-color: var(--imgspec-border); }
      .text-border { color: var(--imgspec-border); }
      .border-border { border-color: var(--imgspec-border); }
      .ring-border { --tw-ring-color: var(--imgspec-border); }
      .bg-input { background-color: var(--imgspec-input); }
      .text-input { color: var(--imgspec-input); }
      .border-input { border-color: var(--imgspec-input); }
      .ring-input { --tw-ring-color: var(--imgspec-input); }
      .bg-ring { background-color: var(--imgspec-ring); }
      .text-ring { color: var(--imgspec-ring); }
      .border-ring { border-color: var(--imgspec-ring); }
      .ring-ring { --tw-ring-color: var(--imgspec-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-4xl mx-auto px-6 py-16">
      <header class="mb-12">
        <p class="text-sm font-medium tracking-widest text-muted-foreground uppercase mb-3">imgspec · Logo 优化</p>
        <h1 class="text-4xl font-semibold text-foreground tracking-tight">B5 入标版精致化方案</h1>
        <p class="mt-3 text-lg text-muted-foreground">去掉图标内文字，放大核心图形，让 Logo 更饱满、更纯粹。</p>
      </header>

      <section class="bg-card rounded-2xl shadow-sm border border-border p-10 mb-10">
        <div class="flex flex-col md:flex-row items-center gap-10">
          <div class="shrink-0">
            <svg viewBox="0 0 680 340" width="680" height="340" role="img" class="w-full max-w-[680px] h-auto">
              <title>B5 imgspec 入标版 · 规格覆盖与方向箭头版</title>
              <desc>左上角图片缩小半透明，右下角虚线规格框覆盖其上，框内以虚线勾勒山形，上方与左侧分别为横向与纵向尺寸箭头，右上角小十字星表示变清晰</desc>
              <defs>
                <symbol id="mkB5" viewBox="0 0 240 240">
                  <rect x="12" y="12" width="216" height="216" rx="52" fill="#1e40af"/>
                  <!-- 顶部水平尺寸标注线 -->
                  <path d="M34 56 L118 56 M34 49 L34 63 M118 49 L118 63" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round"/>
                  <!-- 左侧垂直尺寸标注线 -->
                  <path d="M20 64 L20 124 M13 64 L27 64 M13 124 L27 124" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round"/>
                  <!-- 横向箭头：在上部留白区域，与图片顶部边缘齐平 -->
                  <path d="M34 42 L118 42 M34 42 L40 36 M34 42 L40 48 M118 42 L112 36 M118 42 L112 48" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <!-- 纵向双箭头：在左侧留白区域，与图片左边缘齐平 -->
                  <path d="M18 64 L18 124 M18 64 L12 70 M18 64 L24 70 M18 124 L12 118 M18 124 L24 118" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <!-- 左上角实线图片框：缩小，内容半透明 -->
                  <rect x="34" y="64" width="84" height="60" fill="none" stroke="#ffffff" stroke-width="6"/>
                  <polygon points="46,124 64,92 82,124" fill="#ffffff" fill-opacity="0.5"/>
                  <polygon points="70,124 84,100 98,124" fill="#ffffff" fill-opacity="0.5"/>
                  <!-- 右下角虚线规格框：覆盖在实线框之上，带填充与四角手柄 -->
                  <rect x="90" y="100" width="116" height="92" rx="4" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="6" stroke-dasharray="12 8"/>
                  <circle cx="90" cy="100" r="4" fill="#ffffff"/>
                  <circle cx="206" cy="100" r="4" fill="#ffffff"/>
                  <circle cx="90" cy="192" r="4" fill="#ffffff"/>
                  <circle cx="206" cy="192" r="4" fill="#ffffff"/>
                  <!-- 虚线框内以虚线勾勒山形 -->
                  <path d="M102 168 L120 136 L138 168" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M126 168 L140 144 L154 168" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>
                  <!-- 变清晰：多个小十字星，位于下方白框右上角且不重叠 -->
                  <g fill="#22d3ee">
                    <path d="M188 92 L190 96 L194 96 L190 98 L192 102 L188 99 L184 102 L186 98 L182 96 L186 96 Z"/>
                    <path d="M200 82 L202 86 L206 86 L202 88 L204 92 L200 89 L196 92 L198 88 L194 86 L198 86 Z"/>
                    <path d="M212 72 L214 76 L218 76 L214 78 L216 82 L212 79 L208 82 L210 78 L206 76 L210 76 Z"/>
                  </g>
                </symbol>

                <symbol id="mkB5m" viewBox="0 0 240 240">
                  <rect x="12" y="12" width="216" height="216" rx="52" fill="#1e40af"/>
                  <!-- 横向箭头 -->
                  <path d="M38 46 L112 46 M38 46 L44 40 M38 46 L44 52 M112 46 L106 40 M112 46 L106 52" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                  <!-- 纵向双箭头 -->
                  <path d="M22 68 L22 120 M22 68 L16 74 M22 68 L28 74 M22 120 L16 114 M22 120 L28 114" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
                  <!-- 左上角实线图片框 -->
                  <rect x="38" y="68" width="76" height="52" fill="none" stroke="#ffffff" stroke-width="6.5"/>
                  <polygon points="48,120 64,92 80,120" fill="#ffffff" fill-opacity="0.5"/>
                  <polygon points="70,120 82,100 94,120" fill="#ffffff" fill-opacity="0.5"/>
                  <!-- 右下角虚线规格框 -->
                  <rect x="92" y="102" width="104" height="78" rx="4" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="6" stroke-dasharray="11 7"/>
                  <circle cx="92" cy="102" r="3.5" fill="#ffffff"/>
                  <circle cx="196" cy="102" r="3.5" fill="#ffffff"/>
                  <circle cx="92" cy="180" r="3.5" fill="#ffffff"/>
                  <circle cx="196" cy="180" r="3.5" fill="#ffffff"/>
                  <!-- 虚线山形 -->
                  <path d="M102 168 L116 144 L130 168" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M122 168 L134 148 L146 168" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>
                  <!-- 小十字星 -->
                  <g fill="#22d3ee">
                    <path d="M186 90 L188 94 L192 94 L188 96 L190 100 L186 97 L182 100 L184 96 L180 94 L184 94 Z"/>
                    <path d="M198 80 L200 84 L204 84 L200 86 L202 90 L198 87 L194 90 L196 86 L192 84 L196 84 Z"/>
                  </g>
                </symbol>

                <symbol id="mkB5s" viewBox="0 0 240 240">
                  <rect x="12" y="12" width="216" height="216" rx="52" fill="#1e40af"/>
                  <rect x="48" y="72" width="66" height="44" fill="none" stroke="#ffffff" stroke-width="10"/>
                  <polygon points="58,116 74,88 90,116" fill="#ffffff" fill-opacity="0.5"/>
                  <rect x="102" y="104" width="72" height="54" fill="none" stroke="#ffffff" stroke-width="9" stroke-dasharray="10 8"/>
                </symbol>
              </defs>

              <use href="#mkB5" x="40" y="40" width="200" height="200"/>
              <text x="280" y="118" font-size="42" font-weight="500" fill="#1b2330">图片转换器</text>
              <text x="282" y="152" font-size="18" letter-spacing="7" fill="#1e40af" style="font-family: var(--imgspec-font-sans);">IMGSPEC</text>
              <text x="282" y="186" font-size="13" fill="#5a6572">B5 · 调尺寸 + 变清晰 + 改格式</text>

              <line x1="40" y1="268" x2="640" y2="268" stroke="#00000022" stroke-width="0.5"/>
              <use href="#mkB5" x="40" y="282" width="48" height="48"/>
              <use href="#mkB5m" x="120" y="290" width="32" height="32"/>
              <use href="#mkB5s" x="184" y="298" width="16" height="16"/>
              <text x="216" y="312" font-size="12" fill="#8b95a3">48 全要素 / 32 去字标与标注线 / 16 双框轮廓</text>
            </svg>
          </div>
        </div>
      </section>

      <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-card rounded-xl border border-border p-6">
          <div class="flex items-center gap-3 mb-3">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-md bg-primary/10 text-primary font-semibold text-sm">1</span>
            <h3 class="font-semibold text-foreground">规格框覆盖原图</h3>
          </div>
          <p class="text-sm text-muted-foreground leading-relaxed">左上角图片缩小至 50% 透明度，右下角虚线规格框覆盖其上，框内以虚线勾勒转换后的山形。</p>
        </div>
        <div class="bg-card rounded-xl border border-border p-6">
          <div class="flex items-center gap-3 mb-3">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-md bg-primary/10 text-primary font-semibold text-sm">2</span>
            <h3 class="font-semibold text-foreground">方向箭头分区</h3>
          </div>
          <p class="text-sm text-muted-foreground leading-relaxed">删除斜向双箭头，改为上部横向箭头与左侧纵向双箭头，分别对应宽高两个调整维度，边缘与图框齐平。</p>
        </div>
        <div class="bg-card rounded-xl border border-border p-6">
          <div class="flex items-center gap-3 mb-3">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-md bg-primary/10 text-primary font-semibold text-sm">3</span>
            <h3 class="font-semibold text-foreground">十字星表清晰</h3>
          </div>
          <p class="text-sm text-muted-foreground leading-relaxed">以多个青色小十字星置于虚线框右上角外侧，表示「变清晰」能力，同时删除右下角文件图标。</p>
        </div>
      </section>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
